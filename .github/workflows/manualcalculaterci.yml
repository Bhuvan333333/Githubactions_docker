name : Manual Calculator CI

on:
  workflow_dispatch:

jobs:
  manual_test :
    runs-on : ubuntu:latest

    env :
      APP_ENV : testing

    steps:
      - name : Checkout Repository
        uses : actions/checkout@v4
      - name : Environment Variable through yml file
        run : echo "This application is running in $APP_ENV" #  APP_ENV : ${{vars.APP_ENV}} , for secrets ${{secrets.APP_ENV}}

      - name : Environment variable through github repository
        env :
          APP_ENV : ${{vars.APP_ENV}}
        run : echo "Application is Running in $APP_ENV" 

      - name : Build Docker Image
        run : docker build -t manual_calculator .
      
      - name : Run test
        run : docker run --rm -e APP_ENV = "$APP_ENV" manual_calculator