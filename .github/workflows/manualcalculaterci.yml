name : Manual Calculator CI

on:
  workflow_dispatch:

jobs:
  manual_test :
    runs-on : ubuntu-latest
    env :
      APP_ENV : ${{vars.APP_ENV}} 

    steps:
      - name : Checkout Repository
        uses : actions/checkout@v4

      - name : Environment Variable through yml file
        run : echo "This application is running in ${{vars.APP_ENV}}" #  APP_ENV : ${{vars.APP_ENV}} , for secrets ${{secrets.APP_ENV}}

      - name : Environment variable through github repository
        run : echo "Application is Running in $APP_ENV" 

      - name : Build Docker Image
        run : docker build -t manual_calculator .
      
      - name : Run test
        run : docker run --rm -e APP_ENV="$APP_ENV" manual_calculator

      
      - name: Notify on workflow failure
        if: ${{ failure() }}
        env:
          WEBHOOK_URL: ${{ secrets.FAILURE_WEBHOOK_URL }}
        run: |
          curl -sS -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"application\":\"calculator\",\"status\":\"failed\",\"repository\":\"$GITHUB_REPOSITORY\",\"workflow\":\"$GITHUB_WORKFLOW\",\"run_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"

      - name : pass test
        if: ${{ pass() }}
        env:
          WEBHOOK_URL: ${{ secrets.FAILURE_WEBHOOK_URL }}
        run: |
          curl -sS -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"application\":\"calculator\",\"status\":\"failed\",\"repository\":\"$GITHUB_REPOSITORY\",\"workflow\":\"$GITHUB_WORKFLOW\",\"run_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"

